services:

  mysql:
    image: mysql:8.4
    container_name: concurrency-control-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: huykun17
      MYSQL_DATABASE: concurrency_control

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql


  redis:
    image: redis:7.4
    container_name: concurrency-control-redis
    restart: always

    ports:
      - "6379:6379"



  kafka:
    image: apache/kafka:4.0.0
    container_name: concurrency-control-kafka

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1



  kafka-ui:
    image: provectuslabs/kafka-ui:latest

    container_name: concurrency-control-kafka-ui

    ports:
      - "8085:8080"

    environment:

      KAFKA_CLUSTERS_0_NAME: concurrency-control

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092


volumes:

  mysql-data: